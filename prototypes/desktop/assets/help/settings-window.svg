<svg xmlns="http://www.w3.org/2000/svg" width="920" height="440" viewBox="0 0 920 440" role="img" aria-labelledby="title desc"><title id="title">Settings without losing the conversation</title><desc id="desc">Centered settings with category tabs, Compact density and a text percentage slider. Click outside or close the window to return to the conversation.</desc><defs><linearGradient id="g" x1="0" x2="1"><stop stop-color="#192A47"/><stop offset="1" stop-color="#111D34"/></linearGradient><style>text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#FAFAFC;font-size:17px}.muted{fill:#AAB8D1;font-size:15px}.small{font-size:12px;letter-spacing:1.4px;fill:#A5ACFF}.title{font-size:22px;font-weight:600}.panel{fill:url(#g);stroke:#596A92;stroke-width:1.2}.pill{fill:#252F58;stroke:#6366F1}.soft{fill:#0B1426;stroke:#2A3B5A}</style></defs><rect width="920" height="440" fill="#101D34"/><text class="small" x="34" y="38">YOUR CONVERSATION REMAINS IN PLACE</text><rect class="soft" x="34" y="65" width="852" height="334" rx="16"/><path d="M65 103H370M65 127H420M65 151H310M65 300H306M65 325H334" stroke="#2A3B5A" stroke-width="9" stroke-linecap="round"/><rect x="171" y="99" width="600" height="264" rx="17" fill="#0B1426" opacity=".6"/><rect class="panel" x="160" y="83" width="600" height="264" rx="15"/><text class="title" x="184" y="119">Settings</text><path d="M719 100L733 114M733 100L719 114" stroke="#A5ACFF" stroke-width="2"/><path d="M160 137H760M345 137V347" stroke="#2A3B5A"/><rect class="pill" x="174" y="153" width="157" height="35" rx="8"/><circle cx="192" cy="170" r="4" fill="#A5ACFF"/><text x="207" y="176">General</text><text class="muted" x="193" y="216">Accounts</text><text class="muted" x="193" y="255">Themes</text><text class="muted" x="193" y="294">Conversation</text><text x="370" y="177">Make it comfortable</text><text class="muted" x="370" y="216">Density</text><rect class="soft" x="548" y="195" width="184" height="34" rx="7"/><text x="565" y="217">Compact</text><text class="muted" x="370" y="258">Text size</text><text x="682" y="258">100%</text><path d="M375 289H720" stroke="#2A3B5A" stroke-width="7" stroke-linecap="round"/><path d="M375 289H433" stroke="#818CF8" stroke-width="7" stroke-linecap="round"/><circle cx="433" cy="289" r="10" fill="#A5ACFF"/><text class="muted" x="371" y="326">80%</text><text class="muted" x="683" y="326">200%</text><text class="muted" x="414" y="387">Click outside or close to return to your chat</text></svg>
