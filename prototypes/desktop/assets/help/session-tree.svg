<svg xmlns="http://www.w3.org/2000/svg" width="920" height="440" viewBox="0 0 920 440" role="img" aria-labelledby="title desc">
<title id="title">Sessions and projects beside your conversation</title><desc id="desc">A fixed activity rail sits on the left, with the conversation in the center and Sessions on the right. Two conversations share Project Aurora, while an independent session keeps its own history.</desc>
<defs><style>text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#FAFAFC;font-size:16px}.muted{fill:#AAB8D1;font-size:14px}.eyebrow{fill:#A5ACFF;font-size:12px;letter-spacing:1.4px}.title{font-size:21px;font-weight:600}.surface{fill:#111D34;stroke:#596A92}.panel{fill:#0B1426;stroke:#2A3B5A}.accent{fill:#252F58;stroke:#6366F1}.line{fill:none;stroke:#A5ACFF;stroke-width:1.5;stroke-linecap:round}</style></defs>
<rect width="920" height="440" fill="#101D34"/><text class="eyebrow" x="30" y="34">ONE WORKSPACE, SEPARATE CONVERSATIONS</text><rect class="surface" x="30" y="58" width="860" height="351" rx="13"/>
<path d="M31 91h858" stroke="#2A3B5A"/><text class="muted" x="48" y="80">Orchestrix</text><rect class="panel" x="39" y="101" width="50" height="298" rx="7"/><rect class="accent" x="47" y="115" width="34" height="34" rx="8"/>
