<svg xmlns="http://www.w3.org/2000/svg" width="920" height="440" viewBox="0 0 920 440" role="img" aria-labelledby="title desc"><title id="title">Sessions and project context</title><desc id="desc">Two conversations sit within a project; another standalone conversation can be attached without losing its own history.</desc><defs><linearGradient id="g" x1="0" x2="1"><stop stop-color="#192A47"/><stop offset="1" stop-color="#111D34"/></linearGradient><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1L6 4L1 7" fill="none" stroke="#A5ACFF" stroke-width="1.5"/></marker><style>text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#FAFAFC;font-size:17px}.muted{fill:#AAB8D1;font-size:15px}.small{font-size:12px;letter-spacing:1.4px;fill:#A5ACFF}.title{font-size:22px;font-weight:600}.panel{fill:url(#g);stroke:#596A92;stroke-width:1.2}.line{fill:none;stroke:#A5ACFF;stroke-width:1.5}.pill{fill:#252F58;stroke:#6366F1}.soft{fill:#0B1426;stroke:#2A3B5A}</style></defs><rect width="920" height="440" fill="#101D34"/>
<text class="small" x="34" y="38">SESSIONS</text><rect class="panel" x="34" y="65" width="342" height="235" rx="14"/><text class="title" x="58" y="104">Project Aurora</text><text class="muted" x="58" y="131">Folder + shared instructions</text><path class="line" d="M71 162V252M71 182H92M71 238H92"/>
<rect class="soft" x="93" y="161" width="258" height="43" rx="9"/><text x="109" y="188">Improve search</text><rect class="soft" x="93" y="217" width="258" height="43" rx="9"/><text x="109" y="244">Review sign-up</text>
<rect class="panel" x="34" y="325" width="342" height="78" rx="14"/><text x="58" y="356">Explore an idea</text><text class="muted" x="58" y="381">Standalone session</text>
<rect class="soft" x="454" y="65" width="432" height="125" rx="14"/><text class="title" x="477" y="105">Shared direction</text><text class="muted" x="477" y="134">Project instructions and selected files</text><text class="muted" x="477" y="160">guide related conversations.</text>
<path class="line" d="M376 157H424V125H452" marker-end="url(#arrow)"/>
<rect class="soft" x="454" y="216" width="432" height="92" rx="14"/><text x="477" y="252">Each session keeps its own history.</text><text class="muted" x="477" y="279">Shared context is selected for relevance.</text>
<path class="line" d="M378 364H430V348H454" marker-end="url(#arrow)"/><rect class="pill" x="465" y="328" width="239" height="52" rx="26"/><text x="489" y="360">Attach to a project</text>
</svg>
