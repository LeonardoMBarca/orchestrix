<rect class="panel" x="99" y="101" width="429" height="298" rx="8"/><text class="title" x="121" y="138">Explore an idea</text><text class="muted" x="121" y="166">Independent session</text>
<text x="121" y="221">Start a conversation on its own.</text><text class="muted" x="121" y="250">Attach it to a project when useful.</text><rect class="accent" x="120" y="275" width="38" height="38" rx="8"/><text x="132" y="300">+</text><text class="muted" x="170" y="300">Context and project actions</text><path class="line" d="M121 348h382m-382 17h285" opacity=".6"/>
