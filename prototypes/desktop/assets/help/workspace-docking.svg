<svg xmlns="http://www.w3.org/2000/svg" width="920" height="410" viewBox="0 0 920 410" role="img" aria-labelledby="title desc">
<title id="title">A fixed rail and flexible side panels</title><desc id="desc">Activity navigation remains at the left. Panels can occupy separate sides, share a dock as tabs, or collapse to a resize edge while the conversation stays available.</desc>
<defs><style>text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#FAFAFC;font-size:14px}.muted{fill:#AAB8D1;font-size:13px}.eyebrow{fill:#A5ACFF;font-size:12px;letter-spacing:1.4px}.title{font-size:20px;font-weight:600}.frame{fill:#111D34;stroke:#596A92}.pane{fill:#0B1426;stroke:#2A3B5A}.rail{fill:#172440}.accent{fill:#252F58;stroke:#6366F1}.line{fill:none;stroke:#A5ACFF;stroke-width:1.5;stroke-linecap:round}</style></defs>
<rect width="920" height="410" fill="#101D34"/><text class="eyebrow" x="30" y="35">FIXED NAVIGATION, ROOM TO WORK</text>
<text class="title" x="30" y="80">Two sides</text><rect class="frame" x="30" y="102" width="272" height="224" rx="12"/>
<rect class="rail" x="39" y="112" width="24" height="204" rx="5"/><rect class="accent" x="44" y="124" width="14" height="14" rx="4"/>
<g class="line"><rect x="46" y="151" width="10" height="12" rx="2"/><path d="M46 184h10m-10 5h10m-10 22h10m-5-5v10"/><circle cx="51" cy="279" r="5"/><circle cx="51" cy="300" r="5"/></g>
<rect class="pane" x="70" y="112" width="55" height="204" rx="5"/><text class="muted" transform="translate(103 267) rotate(-90)">Activity panel</text><rect class="pane" x="132" y="112" width="98" height="204" rx="5"/>
<text x="162" y="193">Chat</text><path class="line" d="M145 216h72m-72 15h63m-63 15h69"/><rect class="pane" x="237" y="112" width="55" height="204" rx="5"/><text class="muted" transform="translate(270 259) rotate(-90)">Sessions</text><text class="muted" x="30" y="358">Activity left, Sessions right by default</text>
<text class="title" x="324" y="80">One side, two tabs</text><rect class="frame" x="324" y="102" width="272" height="224" rx="12"/><rect class="rail" x="333" y="112" width="24" height="204" rx="5"/>
<g class="line"><rect x="340" y="126" width="10" height="10" rx="2"/><rect x="340" y="151" width="10" height="12" rx="2"/><path d="M340 184h10m-10 5h10m-10 22h10"/></g>
<rect class="pane" x="364" y="112" width="116" height="204" rx="5"/><rect class="accent" x="370" y="120" width="49" height="25" rx="5"/><text x="379" y="137" style="font-size:11px">Chat</text><text class="muted" x="423" y="137" style="font-size:11px">Sessions</text>
<path class="line" d="M378 171h87m-87 23h69m-69 23h77"/><text x="510" y="193">Chat</text><path class="line" d="M495 216h85m-85 15h72m-72 15h80"/><text class="muted" x="324" y="358">Select a tab to switch panels</text>
<text class="title" x="618" y="80">Collapse by the edge</text><rect class="frame" x="618" y="102" width="272" height="224" rx="12"/><rect class="rail" x="627" y="112" width="24" height="204" rx="5"/>
<g class="line"><rect x="634" y="126" width="10" height="10" rx="2"/><rect x="634" y="151" width="10" height="12" rx="2"/><path d="M634 184h10m-10 5h10m-10 22h10"/></g>
<path d="M660 113v202m220-202v202" stroke="#6366F1" stroke-width="4" stroke-linecap="round"/><text x="750" y="193">Chat</text><path class="line" d="M688 216h163m-163 15h142m-142 15h154"/>
<path class="line" d="m673 267 14-6m-14 6 14 6m-14-6h36m156 0-14-6m14 6-14 6m14-6h-36"/><text class="muted" x="618" y="358">Drag outward to reopen either side</text>
<text class="muted" x="30" y="390">Reorder activities: Alt + ↑ / ↓</text><text class="muted" x="445" y="390">Focused divider: Home collapses · End restores</text>
</svg>
