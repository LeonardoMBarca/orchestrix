<svg xmlns="http://www.w3.org/2000/svg" width="920" height="410" viewBox="0 0 920 410" role="img" aria-labelledby="title desc"><title id="title">Docking panels around the conversation</title><desc id="desc">Separate panels, one shared dock with tabs, and the highlighted left and right destinations around the conversation.</desc><defs><linearGradient id="g" x1="0" x2="1"><stop stop-color="#192A47"/><stop offset="1" stop-color="#111D34"/></linearGradient><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1L6 4L1 7" fill="none" stroke="#A5ACFF" stroke-width="1.5"/></marker><style>text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#FAFAFC;font-size:17px}.muted{fill:#AAB8D1;font-size:15px}.small{font-size:12px;letter-spacing:1.4px;fill:#A5ACFF}.title{font-size:22px;font-weight:600}.panel{fill:url(#g);stroke:#596A92;stroke-width:1.2}.line{fill:none;stroke:#A5ACFF;stroke-width:1.5}.pill{fill:#252F58;stroke:#6366F1}.soft{fill:#0B1426;stroke:#2A3B5A}</style></defs><rect width="920" height="410" fill="#101D34"/>
<text class="small" x="30" y="38">YOUR CONVERSATION STAYS AT THE CENTER</text>
<text class="title" x="30" y="86">Separate sides</text><rect class="panel" x="30" y="110" width="272" height="232" rx="13"/><rect class="soft" x="43" y="126" width="57" height="200" rx="7"/><rect class="soft" x="110" y="126" width="112" height="200" rx="7"/><rect class="soft" x="232" y="126" width="57" height="200" rx="7"/><text class="muted" transform="translate(79 296) rotate(-90)">Sessions</text><text class="muted" transform="translate(268 267) rotate(-90)">Work</text><text x="145" y="204">Chat</text><path class="line" d="M126 230H206M126 247H197M126 264H202"/><text class="muted" x="30" y="376">Left + conversation + right</text>
<text class="title" x="324" y="86">One side, two tabs</text><rect class="panel" x="324" y="110" width="272" height="232" rx="13"/><rect class="soft" x="337" y="126" width="127" height="200" rx="7"/><rect class="pill" x="345" y="137" width="62" height="24" rx="5"/><text x="351" y="153" style="font-size:10px">Sessions</text><text class="muted" x="413" y="153" style="font-size:10px">Work</text><path class="line" d="M349 185H449M349 209H432M349 233H440"/><text x="496" y="204">Chat</text><path class="line" d="M482 230H580M482 247H564M482 264H573"/><text class="muted" x="324" y="376">Select a tab to switch panels</text>
<text class="title" x="618" y="86">Choose a side</text><rect class="panel" x="618" y="110" width="272" height="232" rx="13"/><rect class="soft" x="631" y="126" width="246" height="200" rx="7"/><g opacity=".18"><path d="M692 172H818M692 198H789M692 224H807" stroke="#AAB8D1" stroke-width="10" stroke-linecap="round"/></g><rect class="pill" x="631" y="126" width="63" height="200" rx="9"/><rect class="pill" x="814" y="126" width="63" height="200" rx="9"/><text x="647" y="222" style="font-size:13px">Left</text><text x="827" y="222" style="font-size:13px">Right</text><text class="muted" x="618" y="376">Blur keeps the destinations clear</text>
</svg>
