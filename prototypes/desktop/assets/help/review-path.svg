<svg xmlns="http://www.w3.org/2000/svg" width="920" height="330" viewBox="0 0 920 330" role="img" aria-labelledby="title desc"><title id="title">Review, correction, and application</title><desc id="desc">A request produces work for review; a correction loops back to review, while validation leads to explicit application confirmation.</desc><defs><linearGradient id="g" x1="0" x2="1"><stop stop-color="#192A47"/><stop offset="1" stop-color="#111D34"/></linearGradient><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1L6 4L1 7" fill="none" stroke="#A5ACFF" stroke-width="1.5"/></marker><style>text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#FAFAFC;font-size:17px}.muted{fill:#AAB8D1;font-size:15px}.small{font-size:12px;letter-spacing:1.4px;fill:#A5ACFF}.title{font-size:22px;font-weight:600}.panel{fill:url(#g);stroke:#596A92;stroke-width:1.2}.line{fill:none;stroke:#A5ACFF;stroke-width:1.5}.pill{fill:#252F58;stroke:#6366F1}.soft{fill:#0B1426;stroke:#2A3B5A}</style></defs><rect width="920" height="330" fill="#101D34"/>
<text class="small" x="34" y="38">FOLLOW THE RESULT BEFORE APPLYING IT</text><rect class="panel" x="34" y="94" width="142" height="70" rx="12"/><text x="70" y="136">Request</text><path class="line" d="M176 129H216" marker-end="url(#arrow)"/>
<rect class="panel" x="230" y="94" width="142" height="70" rx="12"/><text x="277" y="136">Work</text><path class="line" d="M372 129H412" marker-end="url(#arrow)"/>
<rect class="pill" x="426" y="94" width="142" height="70" rx="12"/><text x="469" y="136">Review</text><path class="line" d="M568 129H608" marker-end="url(#arrow)"/>
<rect class="panel" x="622" y="94" width="264" height="70" rx="12"/><text x="648" y="136">Confirm application</text><text class="muted" x="629" y="194">Inspect the target and scope</text>
<path class="line" d="M497 165V245H304V178" marker-end="url(#arrow)"/><rect class="soft" x="339" y="223" width="132" height="42" rx="9"/><text class="muted" x="363" y="250">Correction</text><text class="muted" x="34" y="305">Validate = result meets the goal.</text><text class="muted" x="460" y="305">Apply = confirm a change to the target.</text>
</svg>
