<svg xmlns="http://www.w3.org/2000/svg" width="920" height="370" viewBox="0 0 920 370" role="img" aria-labelledby="title desc"><title id="title">Connection usage without guessing</title><desc id="desc">Subscription quota and API spending are separate, with unknown values preserved as not available.</desc><defs><linearGradient id="g" x1="0" x2="1"><stop stop-color="#192A47"/><stop offset="1" stop-color="#111D34"/></linearGradient><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1L6 4L1 7" fill="none" stroke="#A5ACFF" stroke-width="1.5"/></marker><style>text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#FAFAFC;font-size:17px}.muted{fill:#AAB8D1;font-size:15px}.small{font-size:12px;letter-spacing:1.4px;fill:#A5ACFF}.title{font-size:22px;font-weight:600}.panel{fill:url(#g);stroke:#596A92;stroke-width:1.2}.line{fill:none;stroke:#A5ACFF;stroke-width:1.5}.pill{fill:#252F58;stroke:#6366F1}.soft{fill:#0B1426;stroke:#2A3B5A}</style></defs><rect width="920" height="370" fill="#101D34"/>
<text class="small" x="34" y="38">ACCOUNTS AND CAPACITY</text><rect class="panel" x="34" y="65" width="410" height="212" rx="15"/><text class="title" x="57" y="105">Subscription account</text><text class="muted" x="57" y="140">Limits reported by the runtime</text><rect class="soft" x="57" y="163" width="362" height="48" rx="9"/><text x="74" y="194">Usage: Not available</text><text class="muted" x="57" y="248">Window and timestamp when reported</text>
<rect class="panel" x="476" y="65" width="410" height="212" rx="15"/><text class="title" x="499" y="105">API connection</text><text class="muted" x="499" y="140">Separately billed usage</text><rect class="soft" x="499" y="163" width="362" height="48" rx="9"/><text x="516" y="194">Balance: Not available</text><text class="muted" x="499" y="248">Provider data when supported</text>
<rect class="pill" x="34" y="304" width="246" height="38" rx="19"/><text x="57" y="329" style="font-size:15px">Subscription Only</text><text class="muted" x="302" y="329">Keeps paid APIs out of routing and fallback</text>
</svg>
