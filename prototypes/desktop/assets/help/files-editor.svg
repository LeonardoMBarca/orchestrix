<svg xmlns="http://www.w3.org/2000/svg" width="920" height="480" viewBox="0 0 920 480" role="img" aria-labelledby="title desc">
  <title id="title">Browse files and make a small edit</title>
  <desc id="desc">A Files tree contains documents and an .env file. The editor shows an unsaved configuration change. Direct folder access can save to the source with permission; imported files are saved as copies.</desc>
  <defs><style>text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#FAFAFC;font-size:15px}.muted{fill:#AAB8D1;font-size:13px}.eyebrow{fill:#A5ACFF;font-size:12px;letter-spacing:1.4px}.title{font-size:20px;font-weight:600}.code{font-family:Consolas,monospace;font-size:15px}.surface{fill:#111D34;stroke:#596A92}.panel{fill:#0B1426;stroke:#2A3B5A}.accent{fill:#252F58;stroke:#6366F1}.line{fill:none;stroke:#A5ACFF;stroke-width:1.5;stroke-linecap:round}</style></defs>
  <rect width="920" height="480" fill="#101D34"/>
  <text class="eyebrow" x="30" y="34">BROWSE, EDIT, AND KEEP THE DESTINATION CLEAR</text>
  <rect class="surface" x="30" y="58" width="860" height="296" rx="12"/>
  <rect class="panel" x="40" y="68" width="203" height="276" rx="7"/>
  <text class="title" x="57" y="99">Files</text>
  <rect class="panel" x="54" y="113" width="175" height="30" rx="6"/>
  <text class="muted" x="67" y="133">Search files…</text>
  <text x="57" y="173">⌄  project</text>
  <path class="line" d="M72 188v108m0-90h12m-12 35h12m-12 42h12"/>
  <text x="94" y="211">⌄ docs</text>
  <text class="muted" x="104" y="240">architecture.md</text>
  <rect class="accent" x="84" y="266" width="145" height="31" rx="6"/>
  <text x="99" y="287">.env</text>
  <text class="muted" x="94" y="325">README.md</text>
  <rect class="panel" x="253" y="68" width="627" height="276" rx="7"/>
  <path d="M254 104h625m-625 52h625" stroke="#2A3B5A"/>
  <text class="muted" x="272" y="92">Chat</text><text x="334" y="92">.env</text><circle cx="378" cy="87" r="4" fill="#A5ACFF"/>
  <text class="muted" x="404" y="92">architecture.md</text>
  <text x="272" y="128">.env</text><text class="muted" x="272" y="146">File in folder</text>
  <rect class="accent" x="765" y="113" width="98" height="31" rx="7"/>
  <text x="783" y="134" style="font-size:13px">Save file</text>
  <g class="code"><text class="muted" x="276" y="189">1</text><text class="muted" x="276" y="218">2</text><text class="muted" x="276" y="247">3</text><text x="308" y="189">APP_NAME=Orchestrix</text><text x="308" y="218">LOG_LEVEL=info</text><text x="308" y="247">FEATURE_NOTES=true</text></g>
  <path d="M307 203h237" stroke="#6366F1" stroke-width="25" opacity=".12"/>
  <text class="muted" x="272" y="327">Plain text · UTF-8</text><text class="muted" x="718" y="327">Unsaved changes</text>
  <rect class="panel" x="30" y="375" width="415" height="75" rx="11"/>
  <text x="49" y="402">Authorized folder → Save file</text>
  <text class="muted" x="49" y="427">Writes to the source after permission is granted</text>
  <rect class="panel" x="462" y="375" width="428" height="75" rx="11"/>
  <text x="481" y="402">Imported folder → Save a copy</text>
  <text class="muted" x="481" y="427">Downloads a copy; the original stays untouched</text>
</svg>
